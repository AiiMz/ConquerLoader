# Builds the loader and runs the tests for CLCore\Patching.
#
# This fork's whole reason to exist is that the shipped launcher updates the
# client before starting it, and the exe players run should come out of a
# workflow rather than off whichever laptop built it last. See FORK.md.
#
# That exe is EternalAbyss.exe since the rename; ConquerLoader.exe is the same
# build published a second time under the old name, so that shortcuts made
# before the rename still work. Both come from this one artifact.
#
# ConquerLoader.csproj is what ships. ConquerCipherHook.vcxproj is built too but
# nothing is shipped from it here: the loader carries that hook as an embedded
# resource, so the DLL a player gets is the one committed under
# ConquerLoader\Resources. Building it only proves the source that produced it
# still compiles, which is the part that would otherwise rot unnoticed.
# ConquerHook and CLServer this fork does not touch.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # packages.config, not PackageReference, so this is not `dotnet restore`.
      # RestorePackagesConfig plus an explicit SolutionDir is what NuGet.targets
      # needs when it is pointed at a project rather than a solution.
      - name: Restore
        run: >
          msbuild ConquerLoader\ConquerLoader\ConquerLoader.csproj
          -t:Restore -p:RestorePackagesConfig=true
          -p:SolutionDir=${{ github.workspace }}\ConquerLoader\
          -v:minimal -nologo

      - name: Build
        run: >
          msbuild ConquerLoader\ConquerLoader\ConquerLoader.csproj
          -t:Build -p:Configuration=Release
          -p:SolutionDir=${{ github.workspace }}\ConquerLoader\
          -v:minimal -nologo

      # The frame limiter lives in here, and nothing else in this workflow would
      # notice if it stopped compiling - the loader builds perfectly well against
      # the DLL already committed as a resource. Win32 because the client is
      # 32-bit, and Restore because Detours arrives through packages.config.
      #
      # RESTORE AND BUILD ARE TWO INVOCATIONS, exactly as the loader's own steps
      # above are, and combining them is not a tidier way to write the same
      # thing. `-t:Restore;Build` evaluates the project ONCE, before Restore has
      # run, so the conditional import of
      #     ..\ConquerLoader\packages\Detours.4.0.1\build\native\Detours.targets
      # is skipped - the file does not exist yet - and the build then runs
      # without the include path that import contributes.
      #
      # It fails as `error C1083: Cannot open include file: 'detours.h'`, which
      # names neither NuGet nor the import and sends you looking at the compiler.
      # The project HAS a guard meant to produce a readable error for exactly
      # this, EnsureNuGetPackageBuildImports, and it cannot fire: its Exists()
      # check runs at target time, by which point Restore has created the file
      # it is looking for. The guard passes and the build proceeds without the
      # import it was guarding.
      #
      # It only ever fails on a clean checkout, which is why it was invisible
      # locally - a developer machine has the package from a previous build, so
      # the import is there at evaluation time and the combined form works. This
      # step was added in be839db and failed on every run until it was split.
      - name: Restore the cipher hook
        run: >
          msbuild ConquerCipherHook\ConquerCipherHook.vcxproj
          -t:Restore -p:RestorePackagesConfig=true
          -p:Configuration=Release -p:Platform=Win32
          -p:SolutionDir=${{ github.workspace }}\ConquerLoader\
          -v:minimal -nologo

      - name: Build the cipher hook
        run: >
          msbuild ConquerCipherHook\ConquerCipherHook.vcxproj
          -t:Build
          -p:Configuration=Release -p:Platform=Win32
          -p:SolutionDir=${{ github.workspace }}\ConquerLoader\
          -v:minimal -nologo

      # The path guard is the only place where a string from the network becomes
      # a location on a player's disk, and there is no second line of defence
      # behind it. It has already caught one real .NET Framework behaviour
      # difference that the same code did not have on .NET 8.
      - name: Test
        run: dotnet test ConquerLoader\Tests\CLCore.Tests\CLCore.Tests.csproj -c Debug --nologo

      # Costura packs every dependency into the one file. A build that produced
      # a small exe would be one whose weaving silently did not run, and it would
      # fail on a player's machine rather than here.
      #
      # THE NAME IS PART OF THE CHECK. The file is EternalAbyss.exe because the
      # csproj sets TargetName while the assembly stays ConquerLoader - a split
      # that exists to keep the WPF pack URIs working, and one that a later edit
      # to AssemblyName would silently undo. The old name is asserted absent
      # rather than merely not looked for: a build that produced ConquerLoader
      # .exe would be published as the loader under a path nothing serves.
      - name: Check the exe is packed
        shell: pwsh
        run: |
          $exe = "ConquerLoader\Release\EternalAbyss.exe"
          if (-not (Test-Path $exe)) { throw "No EternalAbyss.exe was produced." }
          if (Test-Path "ConquerLoader\Release\ConquerLoader.exe") {
            throw "The build produced ConquerLoader.exe - TargetName is not taking effect."
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          if ($mb -lt 30) { throw "EternalAbyss.exe is only $mb MB - Costura did not pack it." }
          Write-Host "EternalAbyss.exe OK: $mb MB"

      - uses: actions/upload-artifact@v4
        with:
          name: EternalAbyss-loader-${{ github.sha }}
          path: ConquerLoader/Release/EternalAbyss.exe
          retention-days: 14

  # Keep the artifact store under the free tier's 500 MB, the same way
  # EternalAbyssCo/build.yml's prune-artifacts job does - see the comment
  # there for the full reasoning. The short version: retention-days is a time
  # limit, and a busy week uploads this ~40 MB exe often enough that count is
  # the bound that actually binds. Every push at ~40 MB means the default
  # 90-day retention alone would sit well past 500 MB before it ever expired
  # anything; measured on 2026-09-22 this repo already held 9 live artifacts /
  # 370 MB, split across the current EternalAbyss-loader-<sha> name and the
  # ConquerLoader-<sha> name artifacts kept from before the exe was renamed.
  #
  # Retention is global across artifact names, so the legacy ConquerLoader-<sha>
  # artifacts age out after the executable rename instead of keeping a second
  # set of artifacts.
  # push only: a pull_request run from a fork gets a read-only token and could
  # not delete anything, and there is no point failing a job to say so.
  prune-artifacts:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    permissions:
      actions: write

    env:
      KEEP_DEFAULT: 2
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Prune old build artifacts
        run: |
          set -euo pipefail

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false)
                  | [.created_at, .id, .name, .size_in_bytes] | @tsv' > all.tsv

          echo "Before: $(wc -l < all.tsv) live artifact(s), $(awk -F'\t' '{s+=$4} END {printf "%d", s/1048576}' all.tsv) MB"

          # API timestamps are ISO 8601, so reverse lexicographic sort is newest first.
          sort -t$'\t' -k1,1r -k2,2nr all.tsv > sorted.tsv

          awk -F'\t' -v OFS='\t' -v keep="$KEEP_DEFAULT" '
            NR > keep { print $2, $3, $4 }
          ' sorted.tsv > doomed.tsv
          if [ ! -s doomed.tsv ]; then
            echo "Nothing to prune."
            exit 0
          fi

          # Tolerate a failed delete. The ways one fails are a race with the
          # retention sweep or with another run of this job, and both leave the
          # store in the state this job was trying to reach anyway.
          freed=0
          while IFS=$'\t' read -r id name bytes; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent; then
              echo "deleted  $name  ($((bytes / 1048576)) MB)"
              freed=$((freed + bytes))
            else
              echo "::warning::Could not delete artifact $id ($name); it may already be gone."
            fi
          done < doomed.tsv

          echo "Freed $((freed / 1048576)) MB across $(wc -l < doomed.tsv) artifact(s)."
