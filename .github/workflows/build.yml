# .NET 10 launcher: native injection remains Win32; managed delivery is one
# self-contained bundle so players do not need to install a separate runtime.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build the embedded native cipher hook
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolset = Get-ChildItem "$vs/MSBuild/Microsoft/VC/*/Platforms/Win32/PlatformToolsets/v*/Toolset.props" |
            Sort-Object { [int]$_.Directory.Name.Substring(1) } -Descending | Select-Object -First 1
          if (-not $toolset) { throw 'No installed Win32 Visual C++ toolset.' }
          $arguments = @('-p:Configuration=Release', '-p:Platform=Win32', "-p:PlatformToolset=$($toolset.Directory.Name)", "-p:SolutionDir=$pwd/ConquerLoader/")
          msbuild ConquerCipherHook/ConquerCipherHook.vcxproj -t:Restore -p:RestorePackagesConfig=true @arguments -nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild ConquerCipherHook/ConquerCipherHook.vcxproj -t:Rebuild @arguments -nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build all managed projects
        shell: pwsh
        run: |
          foreach ($project in @('ConquerLoader','CLServer','ExamplePlugin','CLAutoPatchPlugin')) {
            dotnet build "ConquerLoader/$project/$project.csproj" -c Release --nologo
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Test launcher behavior
        run: dotnet test ConquerLoader/Tests/CLCore.Tests/CLCore.Tests.csproj -c Release --nologo
      - name: Publish self-contained x86 launcher
        run: dotnet publish ConquerLoader/ConquerLoader/ConquerLoader.csproj -c Release -r win-x86 --self-contained true -o artifact --nologo
      - name: Verify bundled runtime
        shell: pwsh
        run: |
          $runtime = Get-Content ConquerLoader/ConquerLoader/bin/Release/net10.0-windows/win-x86/EternalAbyss.runtimeconfig.json -Raw | ConvertFrom-Json
          if ($runtime.runtimeOptions.tfm -ne 'net10.0' -or -not @($runtime.runtimeOptions.includedFrameworks | Where-Object {
              $_.name -eq 'Microsoft.NETCore.App' -and $_.version -like '10.*'
          }).Count) { throw 'Expected a self-contained .NET 10 launcher.' }
          if (-not (Test-Path artifact/EternalAbyss.exe)) { throw 'No bundled launcher.' }
      - uses: actions/upload-artifact@v4
        with:
          name: EternalAbyss-loader-${{ github.sha }}
          path: artifact/EternalAbyss.exe
          retention-days: 14

  # Keep the artifact store under the free tier's 500 MB, the same way
  # EternalAbyssCo/build.yml's prune-artifacts job does - see the comment
  # there for the full reasoning. The short version: retention-days is a time
  # limit, and a busy week uploads this ~40 MB exe often enough that count is
  # the bound that actually binds. Every push at ~40 MB means the default
  # 90-day retention alone would sit well past 500 MB before it ever expired
  # anything; measured on 2026-09-22 this repo already held 9 live artifacts /
  # 370 MB, split across the current EternalAbyss-loader-<sha> name and the
  # ConquerLoader-<sha> name artifacts kept from before the exe was renamed.
  #
  # Retention is global across artifact names, so the legacy ConquerLoader-<sha>
  # artifacts age out after the executable rename instead of keeping a second
  # set of artifacts.
  # push only: a pull_request run from a fork gets a read-only token and could
  # not delete anything, and there is no point failing a job to say so.
  prune-artifacts:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    permissions:
      actions: write

    env:
      KEEP_DEFAULT: 2
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Prune old build artifacts
        run: |
          set -euo pipefail

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false)
                  | [.created_at, .id, .name, .size_in_bytes] | @tsv' > all.tsv

          echo "Before: $(wc -l < all.tsv) live artifact(s), $(awk -F'\t' '{s+=$4} END {printf "%d", s/1048576}' all.tsv) MB"

          # API timestamps are ISO 8601, so reverse lexicographic sort is newest first.
          sort -t$'\t' -k1,1r -k2,2nr all.tsv > sorted.tsv

          awk -F'\t' -v OFS='\t' -v keep="$KEEP_DEFAULT" '
            NR > keep { print $2, $3, $4 }
          ' sorted.tsv > doomed.tsv
          if [ ! -s doomed.tsv ]; then
            echo "Nothing to prune."
            exit 0
          fi

          # Tolerate a failed delete. The ways one fails are a race with the
          # retention sweep or with another run of this job, and both leave the
          # store in the state this job was trying to reach anyway.
          freed=0
          while IFS=$'\t' read -r id name bytes; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent; then
              echo "deleted  $name  ($((bytes / 1048576)) MB)"
              freed=$((freed + bytes))
            else
              echo "::warning::Could not delete artifact $id ($name); it may already be gone."
            fi
          done < doomed.tsv

          echo "Freed $((freed / 1048576)) MB across $(wc -l < doomed.tsv) artifact(s)."
